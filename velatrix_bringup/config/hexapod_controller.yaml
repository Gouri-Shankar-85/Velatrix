controller_manager:
  ros__parameters:
    update_rate: 100

    joint_trajectory_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    forward_position_controller:
      type: position_controllers/JointGroupPositionController

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

joint_state_broadcaster:
  ros__parameters:
    use_urdf_to_filter: false
    joints:
      - c1_jt
      - f1_jt
      - t1_jt
      - c2_jt
      - f2_jt
      - t2_jt
      - c3_jt
      - f3_jt
      - t3_jt
      - c4_jt
      - f4_jt
      - t4_jt
      - c5_jt
      - f5_jt
      - t5_jt
      - c6_jt
      - f6_jt
      - t6_jt

joint_trajectory_controller:
  ros__parameters:
    type: "joint_trajectory_controller/JointTrajectoryController"
    joints:
      - c1_jt
      - c2_jt
      - c3_jt
      - c4_jt
      - c5_jt
      - c6_jt
      - f1_jt
      - f2_jt
      - f3_jt
      - f4_jt
      - f5_jt
      - f6_jt
      - t1_jt
      - t2_jt
      - t3_jt
      - t4_jt
      - t5_jt
      - t6_jt

    command_interfaces:
      - position
    state_interfaces:
      - position
    state_publish_rate: 100.0
    action_monitor_rate: 20.0
    allow_partial_joints_goal: true
    constraints:
      stopped_velocity_tolerance: 0.2
      goal_time: 0.0
      c1_jt: { trajectory: 0.2, goal: 0.1 }
      c2_jt: { trajectory: 0.2, goal: 0.1 }
      c3_jt: { trajectory: 0.2, goal: 0.1 }
      c4_jt: { trajectory: 0.2, goal: 0.1 }
      c5_jt: { trajectory: 0.2, goal: 0.1 }
      c6_jt: { trajectory: 0.2, goal: 0.1 }
      f1_jt: { trajectory: 0.2, goal: 0.1 }
      f2_jt: { trajectory: 0.2, goal: 0.1 }
      f3_jt: { trajectory: 0.2, goal: 0.1 }
      f4_jt: { trajectory: 0.2, goal: 0.1 }
      f5_jt: { trajectory: 0.2, goal: 0.1 }
      f6_jt: { trajectory: 0.2, goal: 0.1 }
      t1_jt: { trajectory: 0.2, goal: 0.1 }
      t2_jt: { trajectory: 0.2, goal: 0.1 }
      t3_jt: { trajectory: 0.2, goal: 0.1 }
      t4_jt: { trajectory: 0.2, goal: 0.1 }
      t5_jt: { trajectory: 0.2, goal: 0.1 }
      t6_jt: { trajectory: 0.2, goal: 0.1 }

forward_position_controller:
  ros__parameters:
    type: position_controllers/JointGroupPositionController
    joints:
      - c1_jt
      - c2_jt
      - c3_jt
      - c4_jt
      - c5_jt
      - c6_jt
      - f1_jt
      - f2_jt
      - f3_jt
      - f4_jt
      - f5_jt
      - f6_jt
      - t1_jt
      - t2_jt
      - t3_jt
      - t4_jt
      - t5_jt
      - t6_jt

    interface_name: position
