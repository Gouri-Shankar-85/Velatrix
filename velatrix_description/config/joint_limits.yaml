# Joint limits for Velatrix Hexapod
# Using DS3225 Digital Servo Specifications
# Torque: 25 kg-cm (2.45 Nm)
# Speed: 0.09 sec/60° (max 11.64 rad/s)
# Rotation: 180° (±90° from center)

joint_limits:
  # ===== LEG 1 =====
  c1_jt:  # Coxa joint (hip yaw)
    has_position_limits: true
    has_velocity_limits: true
    has_effort_limits: true
    has_acceleration_limits: false
    min_position: -0.785398  # -45° 
    max_position: 0.785398   # +45°
    max_velocity: 3.0        # rad/s 
    max_effort: 2.4          # Nm 
  
  f1_jt:  # Femur joint (hip pitch)
    has_position_limits: true
    has_velocity_limits: true
    has_effort_limits: true
    has_acceleration_limits: false
    min_position: -0.785398  
    max_position: 0.785398   
    max_velocity: 3.0
    max_effort: 2.4
  
  t1_jt:  # Tibia joint (knee)
    has_position_limits: true
    has_velocity_limits: true
    has_effort_limits: true
    has_acceleration_limits: false
    min_position: -0.785398  # -90° (full extension)
    max_position: 0.785398   # +45° (bent position)
    max_velocity: 3.0
    max_effort: 2.4

